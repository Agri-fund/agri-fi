{{- if .Values.rabbitmq.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-rabbitmq
spec:
  serviceName: {{ .Release.Name }}-rabbitmq
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: {{ .Values.secrets.rabbitmqUserKey }}, optional: true}}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: {{ .Values.secrets.rabbitmqPasswordKey }}, optional: true}}
          readinessProbe: {tcpSocket: {port: amqp}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: amqp}, initialDelaySeconds: 30, periodSeconds: 20}
          volumeMounts:
            - {name: rabbitmq-data, mountPath: /var/lib/rabbitmq}
  volumeClaimTemplates:
    - metadata: {name: rabbitmq-data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: {{ .Values.rabbitmq.storage }}}}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-rabbitmq}
spec:
  selector: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
    - {name: management, port: 15672, targetPort: management}
{{- end }}
