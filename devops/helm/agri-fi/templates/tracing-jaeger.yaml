{{- if .Values.tracing.enabled }}
{{- $esUrl := .Values.tracing.elasticsearch.externalUrl | default (printf "http://%s-trace-es:9200" .Release.Name) }}
# Jaeger with durable Elasticsearch span storage (#1308).
# OTLP in: <release>-jaeger:4317 (gRPC) / :4318 (HTTP). UI: :16686.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-jaeger-ilm
data:
  jaeger-ilm-policy.json: |
    {
      "policy": {
        "phases": {
          "hot": {
            "min_age": "0ms",
            "actions": {
              "rollover": {"max_age": "1d", "max_primary_shard_size": "20gb"},
              "set_priority": {"priority": 100}
            }
          },
          "delete": {
            "min_age": "{{ .Values.tracing.retentionDays }}d",
            "actions": {"delete": {}}
          }
        }
      }
    }
---
# Installs the ILM policy and Jaeger's index templates / rollover aliases after
# every install / upgrade (idempotent).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-jaeger-es-init-{{ .Release.Revision }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: ilm-policy
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              AUTH=""
              [ -n "$ES_USERNAME" ] && AUTH="-u $ES_USERNAME:$ES_PASSWORD"
              until curl -fsS $AUTH "{{ $esUrl }}/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null; do
                echo "waiting for Elasticsearch..."; sleep 5
              done
              curl -fsS $AUTH -X PUT -H "Content-Type: application/json" \
                --data-binary @/policy/jaeger-ilm-policy.json \
                "{{ $esUrl }}/_ilm/policy/jaeger-ilm-policy"
          env:
            - name: ES_USERNAME
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: {{ .Values.secrets.jaegerEsUsernameKey }}, optional: true}}
            - name: ES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: {{ .Values.secrets.jaegerEsPasswordKey }}, optional: true}}
          volumeMounts:
            - {name: ilm, mountPath: /policy}
      containers:
        - name: es-rollover-init
          image: {{ .Values.tracing.jaeger.esRolloverImage }}
          args: ["init", "{{ $esUrl }}"]
          env:
            - {name: ES_USE_ILM, value: "true"}
            - {name: ES_ILM_POLICY_NAME, value: jaeger-ilm-policy}
            - name: ES_USERNAME
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: {{ .Values.secrets.jaegerEsUsernameKey }}, optional: true}}
            - name: ES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: {{ .Values.secrets.jaegerEsPasswordKey }}, optional: true}}
      volumes:
        - name: ilm
          configMap: {name: {{ .Release.Name }}-jaeger-ilm}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-jaeger
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: jaeger, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: jaeger, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.tracing.jaeger.image }}
          ports:
            - {name: ui, containerPort: 16686}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
          env:
            - {name: COLLECTOR_OTLP_ENABLED, value: "true"}
            - {name: SPAN_STORAGE_TYPE, value: elasticsearch}
            - {name: ES_SERVER_URLS, value: {{ $esUrl | quote }}}
            - {name: ES_USE_ILM, value: "true"}
            - {name: ES_USE_ALIASES, value: "true"}
            # Templates / aliases are created by the init Job above.
            - {name: ES_CREATE_INDEX_TEMPLATES, value: "false"}
            - name: ES_USERNAME
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: {{ .Values.secrets.jaegerEsUsernameKey }}, optional: true}}
            - name: ES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: {{ .Values.secrets.jaegerEsPasswordKey }}, optional: true}}
          resources: {{- toYaml .Values.tracing.jaeger.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /, port: ui}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: ui}
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-jaeger}
spec:
  selector: {app.kubernetes.io/name: jaeger, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: ui, port: 16686, targetPort: ui}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
{{- end }}
