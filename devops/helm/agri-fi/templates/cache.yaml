{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe: {exec: {command: [redis-cli, ping]}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {exec: {command: [redis-cli, ping]}, initialDelaySeconds: 15, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-redis}
spec:
  selector: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: redis, port: 6379, targetPort: redis}]
{{- end }}
