environment: dev

backend:
  enabled: true
  image:
    repository: agri-fi/backend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    port: 80
    targetPort: 3001
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  healthPath: /health
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

frontend:
  enabled: true
  image:
    repository: agri-fi/frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    port: 80
    targetPort: 3000
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    limits: {cpu: 400m, memory: 512Mi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 20Gi
  database: agric_onchain

redis:
  enabled: true
  image: redis:7-alpine
  storage: 1Gi

rabbitmq:
  enabled: true
  image: rabbitmq:3.13-management-alpine
  storage: 2Gi
  # Vhost the app connects to. Production uses /production; staging overlays
  # (e.g. values-staging.yaml) must override this with /staging so staging and
  # production never share a vhost. The default "/" vhost is not used for app
  # traffic.
  vhost: /production

# Distributed tracing backend (#1308). Jaeger stores spans in Elasticsearch so
# traces survive pod restarts; an ILM policy rolls indices over daily and
# deletes them after `retentionDays`.
tracing:
  enabled: true
  retentionDays: 30
  jaeger:
    image: jaegertracing/all-in-one:1.60
    # Runs `init` (index templates + rollover aliases wired to ILM) on each release.
    esRolloverImage: jaegertracing/jaeger-es-rollover:1.60
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
  elasticsearch:
    # In-cluster single-node Elasticsearch (dev / staging).
    # Production sets enabled=false and `externalUrl` to the Terraform output
    # `trace_es_endpoint` (devops/terraform/elasticsearch.tf).
    enabled: true
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    storage: 30Gi
    javaOpts: "-Xms512m -Xmx512m"
    resources:
      requests: {cpu: 250m, memory: 1Gi}
      limits: {cpu: 1000m, memory: 1536Mi}
    externalUrl: ""

config:
  databaseHost: agri-fi-postgres
  databasePort: 5432
  redisHost: agri-fi-redis
  redisPort: 6379
  rabbitmqHost: agri-fi-rabbitmq
  rabbitmqPort: 5672
  rabbitmqVhost: /production

secrets:
  existingSecret: agri-fi-backend-secrets
  databaseUserKey: DATABASE_USER
  databasePasswordKey: DATABASE_PASSWORD
  rabbitmqUserKey: RABBITMQ_USER
  rabbitmqPasswordKey: RABBITMQ_PASSWORD
  # Only needed when tracing.elasticsearch.externalUrl is set and secured
  # (synced from the Terraform `trace_es_credentials` secret).
  jaegerEsUsernameKey: JAEGER_ES_USERNAME
  jaegerEsPasswordKey: JAEGER_ES_PASSWORD

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  frontendHost: agri-fi.example.com
  backendHost: api.agri-fi.example.com
  tlsSecretName: agri-fi-tls
