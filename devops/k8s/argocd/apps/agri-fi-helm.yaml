apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agri-fi-helm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: agri-fi
    app.kubernetes.io/component: platform
spec:
  project: agri-fi
  source:
    repoURL: https://github.com/Agri-fund/agri-fi.git
    targetRevision: main
    path: devops/helm/agri-fi
    helm:
      releaseName: agri-fi
      valueFiles:
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: agri-fi
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
