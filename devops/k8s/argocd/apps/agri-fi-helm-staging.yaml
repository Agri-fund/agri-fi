apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agri-fi-helm-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: agri-fi
    app.kubernetes.io/environment: staging
spec:
  project: agri-fi
  source:
    repoURL: https://github.com/Agri-fund/agri-fi.git
    targetRevision: main
    path: devops/helm/agri-fi
    helm:
      releaseName: agri-fi-staging
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: agri-fi-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
