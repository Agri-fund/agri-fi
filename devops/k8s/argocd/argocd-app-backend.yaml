apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agri-fi-backend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: agri-fi
  source:
    repoURL: https://github.com/Agri-fund/agri-fi.git
    targetRevision: main
    path: devops/k8s/backend
  destination:
    server: https://kubernetes.default.svc
    namespace: agri-fi
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
