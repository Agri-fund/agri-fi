; PgBouncer configuration for agri-fi (#839)
;
; This file is mounted into the PgBouncer sidecar container at
; /bitnami/pgbouncer/conf/pgbouncer.ini via the pgbouncer-config ConfigMap
; (devops/k8s/pgbouncer-configmap.yaml).
;
; Pool topology
; ─────────────
; Each backend pod has one PgBouncer sidecar that listens on 127.0.0.1:6432.
; The NestJS application connects to localhost:6432 rather than the upstream
; postgres:5432 service.  PgBouncer maintains a server-side pool of up to
; max_connections_per_pool=100 real Postgres connections per pool (one pool per
; database+user combination), while accepting up to max_client_conn=200
; simultaneous client connections from the application.
;
; Pool mode: transaction
; ──────────────────────
; In transaction mode a server connection is only held for the duration of a
; single transaction.  This gives the best connection efficiency for NestJS
; TypeORM workloads where most transactions are short-lived.
;
; NOTE: Session-level features (SET, advisory locks, LISTEN/NOTIFY, prepared
; statements with DEALLOCATE ALL disabled) are not compatible with transaction
; mode.  TypeORM should have prepare: false or use simple-query protocol.

[databases]
; Route the application database to the upstream Postgres service.
; The placeholder values below are overridden at runtime by the Bitnami
; image env vars (POSTGRESQL_HOST, POSTGRESQL_PORT, PGBOUNCER_DATABASE).
agric_onchain = host=postgres port=5432 dbname=agric_onchain
                pool_size=100

; Virtual database used by pgbouncer_exporter to query internal stats.
; The exporter connects as the `pgbouncer` pseudo-user — no real Postgres
; connection is opened for this virtual db.
pgbouncer = host=127.0.0.1 port=6432 dbname=pgbouncer

[pgbouncer]
; ── Network ──────────────────────────────────────────────────────────────────
; Bind only to loopback — the sidecar is not accessible outside the pod.
listen_addr = 127.0.0.1
listen_port = 6432

; ── Authentication ────────────────────────────────────────────────────────────
; Use md5 for compatibility with older Postgres and the exporter.
; auth_file contains the userlist (username + md5-hashed password pairs).
auth_type = md5
auth_file = /bitnami/pgbouncer/conf/userlist.txt

; ── Pooling ──────────────────────────────────────────────────────────────────
; Transaction pooling: server connection held only for the duration of a
; transaction, then returned to the pool immediately.
pool_mode = transaction

; Maximum number of client connections accepted across all pools.
; With 2 replicas × 200 client connections = 400 max app-side connections
; while the real Postgres exposure is capped at 100 per pool per pod.
max_client_conn = 200

; Default number of server connections per pool (database+user pair).
; Overridden per-database in [databases] above.
default_pool_size = 100

; Minimum number of server connections kept alive when the pool is idle.
; Avoids cold-start latency on the first requests after a quiet period.
min_pool_size = 5

; Reserve connections for admin/maintenance use (e.g. pg_dump, migrations).
reserve_pool_size = 5

; Seconds to wait before using a reserve connection for a queued client.
reserve_pool_timeout = 3.0

; ── Timeouts ─────────────────────────────────────────────────────────────────
; Seconds a client can wait for a server connection before receiving an error.
; Prevents cascading hangs under heavy load.
client_login_timeout = 60

; Seconds a server connection can sit idle in the pool before being closed.
server_idle_timeout = 600

; Seconds PgBouncer waits for the Postgres server to accept a new connection.
server_connect_timeout = 15

; Seconds to wait for a query/transaction to finish before forcibly closing
; the client connection.  Pairs with TypeORM's statement_timeout.
query_timeout = 0

; Seconds a client connection can sit idle in a pool before being closed.
client_idle_timeout = 0

; ── Server lifecycle ─────────────────────────────────────────────────────────
; Check server health with a lightweight SELECT 1 before use.
server_check_query = select 1
server_check_delay = 30

; Close a server connection after it has been used this many times.
; Prevents long-lived connections from accumulating state.
server_lifetime = 3600

; Prefer reusing existing server connections over opening new ones.
server_reset_query = DISCARD ALL

; ── Stats & admin ────────────────────────────────────────────────────────────
; Users allowed to connect to the pgbouncer virtual database to query stats.
; The pgbouncer_exporter sidecar uses the `pgbouncer` pseudo-user.
stats_users = pgbouncer

; Period (seconds) between internal stats updates.
stats_period = 60

; ── Logging ──────────────────────────────────────────────────────────────────
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; Verbose logging for debugging (set to 1 for troubleshooting, 0 in prod).
verbose = 0
