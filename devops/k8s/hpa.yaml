# Backend HPA (#836) — scales the ACTIVE blue-green slot only. The CD pipeline
# deploys to the inactive slot at a fixed replica count and flips the Service
# selector; autoscaling the idle slot would fight that process, so this HPA
# must always point at whichever slot the Service currently selects.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agri-fi-backend
  labels:
    app: agri-fi-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agri-fi-backend-blue
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agri-fi-frontend
  labels:
    app: agri-fi-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agri-fi-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
