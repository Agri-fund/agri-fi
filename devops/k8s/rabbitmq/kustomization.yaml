# Kustomization for the RabbitMQ workload.
# ArgoCD uses this as the entry-point when syncing the agri-fi-rabbitmq app.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agri-fi

resources:
  - statefulset.yaml
  - service.yaml
  - configmap.yaml
  - network-policy.yaml

commonLabels:
  app.kubernetes.io/part-of: agri-fi
  app.kubernetes.io/managed-by: argocd
