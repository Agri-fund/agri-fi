groups:
  # ── Redis Cache Memory Alerts (#735) ─────────────────────────────────────────
  - name: agri_fi_redis_memory
    interval: 30s
    rules:
      # ── Redis memory usage approaching limit (warning at 80%) ──────────────
      - alert: RedisMemoryUsageHigh
        expr: |
          (
            redis_memory_used_bytes
            /
            redis_memory_max_bytes
          ) * 100 > 80
        for: 2m
        labels:
          severity: warning
          team: backend
          component: cache
        annotations:
          summary: "Redis memory usage above 80%"
          description: >
            Redis instance {{ $labels.instance }} memory usage has exceeded 80%
            of the configured maxmemory limit for more than 2 minutes.
            Current usage: {{ $value | printf "%.1f" }}%.
            The allkeys-lru eviction policy will begin evicting keys to free memory.
            Investigate growth in session/rate-limit keys or increase maxmemory.

      # ── Redis memory usage critical (90%) ──────────────────────────────────
      - alert: RedisMemoryUsageCritical
        expr: |
          (
            redis_memory_used_bytes
            /
            redis_memory_max_bytes
          ) * 100 > 90
        for: 1m
        labels:
          severity: critical
          team: backend
          component: cache
          pagerduty: "true"
        annotations:
          summary: "Redis memory usage above 90% — eviction pressure is high"
          description: >
            Redis instance {{ $labels.instance }} memory usage has exceeded 90%
            of the configured maxmemory limit for more than 1 minute.
            Current usage: {{ $value | printf "%.1f" }}%.
            Aggressive key eviction is in progress. Session authentications and
            rate-limit counters may be affected. Scale up Redis memory immediately.

      # ── Redis maxmemory is not configured (guard) ───────────────────────────
      - alert: RedisMaxMemoryNotConfigured
        expr: redis_memory_max_bytes == 0
        for: 5m
        labels:
          severity: warning
          team: platform
          component: cache
        annotations:
          summary: "Redis maxmemory is not set — memory usage cannot be bounded"
          description: >
            Redis instance {{ $labels.instance }} has no maxmemory limit configured.
            Without a memory cap and eviction policy, Redis may consume all available
            host memory and cause an OOM kill. Set maxmemory and maxmemory-policy
            in the Redis configuration.

      # ── Redis eviction rate spike ────────────────────────────────────────────
      - alert: RedisHighEvictionRate
        expr: rate(redis_evicted_keys_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          team: backend
          component: cache
        annotations:
          summary: "Redis is evicting keys at an elevated rate"
          description: >
            Redis instance {{ $labels.instance }} is evicting more than 10 keys
            per second (averaged over 5 minutes).
            Eviction rate: {{ $value | printf "%.1f" }} keys/sec.
            This indicates memory pressure. Session data and rate-limit counters
            are at risk of being evicted before expiry.

      # ── Redis exporter down ──────────────────────────────────────────────────
      - alert: RedisExporterDown
        expr: up{job="redis_exporter"} == 0
        for: 1m
        labels:
          severity: warning
          team: platform
          component: cache
        annotations:
          summary: "Redis exporter is down — cache memory metrics unavailable"
          description: >
            The redis_exporter instance {{ $labels.instance }} has been
            unreachable for more than 1 minute. Redis memory alerts will not fire.

      # ── Redis instance down ──────────────────────────────────────────────────
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          team: backend
          component: cache
          pagerduty: "true"
        annotations:
          summary: "Redis is down — caching and rate-limiting unavailable"
          description: >
            Redis instance {{ $labels.instance }} has been unreachable for
            more than 1 minute. Session caching and rate-limiting are
            degraded. The application will fall back to in-memory cache.

  # ── PostgreSQL server-level connection alerts (#1037) ────────────────────────
  # These rules target the postgres_exporter (pg_stat_activity / pg_settings_*)
  # metrics that reflect real server connections on the RDS instance.
  #
  # Budget reference (db.t3.small, max_connections=200):
  #   Usable budget  : 170  (200 − 30 reserved)
  #   HPA maxReplicas: 8
  #   pool_size/pod  : 20
  #   Worst-case     : 160 connections  (10 spare before alert fires)
  #
  # Alert threshold : 85% of max_connections
  #   85% × 200 = 170 — triggers exactly at the usable budget ceiling,
  #   giving the on-call team time to act before hard exhaustion.
  - name: agri_fi_database_pool
    interval: 30s
    rules:
      # ── Recording rule: % of max_connections in use (#1037) ───────────────
      # Pre-compute the ratio so all threshold alerts share one expression.
      # Metric: agri_fi:pg_connections_pct
      - record: agri_fi:pg_connections_pct
        expr: |
          (
            sum by (instance, datname) (
              pg_stat_activity_count{datname="agric_onchain", state!="idle"}
            )
            /
            pg_settings_max_connections
          ) * 100

      # ── Warning at 85% of max_connections (#1037) ─────────────────────────
      - alert: DatabaseConnectionSaturationWarning
        expr: agri_fi:pg_connections_pct > 85
        for: 2m
        labels:
          severity: warning
          team: backend
          owner: backend-oncall
          runbook: "https://runbooks.internal/agri-fi/db-pool"
          component: database
        annotations:
          summary: "DB connections above 85% of max_connections"
          description: >
            Active (non-idle) connections to agric_onchain on
            {{ $labels.instance }} have exceeded 85% of max_connections
            for more than 2 minutes.
            Current usage: {{ $value | printf "%.1f" }}%.
            Budget: {{ $value | printf "%.0f" }} / 200 connections used.
            At 8 replicas × pool_size 20 the ceiling is 160 (80%).
            Investigate: unexpected replica scale-up, long-running queries,
            or idle-in-transaction connections holding slots.
            Runbook: https://runbooks.internal/agri-fi/db-pool

      # ── Critical at 95% of max_connections ────────────────────────────────
      - alert: DatabaseConnectionSaturationCritical
        expr: agri_fi:pg_connections_pct > 95
        for: 1m
        labels:
          severity: critical
          team: backend
          owner: backend-oncall
          runbook: "https://runbooks.internal/agri-fi/db-pool"
          component: database
          pagerduty: "true"
        annotations:
          summary: "DB connections above 95% — imminent exhaustion"
          description: >
            Active (non-idle) connections to agric_onchain on
            {{ $labels.instance }} have exceeded 95% of max_connections
            for more than 1 minute.
            Current usage: {{ $value | printf "%.1f" }}%.
            New connections will be rejected when 100% is reached.
            Immediate actions:
              1. Check HPA replica count — scale down if > 8 replicas
              2. Kill idle-in-transaction sessions older than 30s
              3. Verify pgbouncer pool_size has not drifted from 20
            Runbook: https://runbooks.internal/agri-fi/db-pool

      # ── Idle-in-transaction connections (long-running uncommitted txns) ────
      - alert: DatabaseIdleInTransactionConnections
        expr: |
          pg_stat_activity_count{datname="agric_onchain", state="idle in transaction"} > 5
        for: 3m
        labels:
          severity: warning
          team: backend
          owner: backend-oncall
          runbook: "https://runbooks.internal/agri-fi/db-pool"
          component: database
        annotations:
          summary: "High number of idle-in-transaction connections"
          description: >
            {{ $value }} connections on {{ $labels.instance }} are in
            'idle in transaction' state for more than 3 minutes.
            These hold row locks and consume slots from the 200-connection
            budget without doing useful work. Check for uncommitted
            TypeORM transactions and ensure statement_timeout is set.

      # ── Connection pool fully exhausted ────────────────────────────────────
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          sum by (instance, datname) (
            pg_stat_activity_count{datname="agric_onchain", state!="idle"}
          ) >= pg_settings_max_connections
        for: 30s
        labels:
          severity: critical
          team: backend
          owner: backend-oncall
          runbook: "https://runbooks.internal/agri-fi/db-pool"
          component: database
          pagerduty: "true"
        annotations:
          summary: "Database connection pool exhausted — new connections will be rejected"
          description: >
            All {{ $value }} connections on {{ $labels.instance }} are in use.
            New API requests requiring a DB connection will fail immediately.
            Emergency steps:
              1. SELECT pg_terminate_backend(pid) for idle-in-transaction
                 sessions: SELECT pid FROM pg_stat_activity WHERE state =
                 'idle in transaction' AND now() - state_change > interval '30s';
              2. Manually scale down the backend HPA if replicas > 8
              3. Restart pgbouncer sidecars to flush stale connections

      # ── Exporter down (no metrics from postgres_exporter) ──────────────────
      - alert: DatabaseExporterDown
        expr: up{job="postgres_exporter"} == 0
        for: 1m
        labels:
          severity: warning
          team: platform
          owner: platform-oncall
          runbook: "https://runbooks.internal/agri-fi/postgres-exporter"
          component: database
        annotations:
          summary: "Postgres exporter is down — DB pool metrics unavailable"
          description: >
            The postgres_exporter instance {{ $labels.instance }} has been
            unreachable for more than 1 minute. Connection pool saturation
            alerts (DatabaseConnectionSaturationWarning / Critical) will
            not fire until the exporter is restored.

  # ── PgBouncer sidecar pool alerts (#1037) ────────────────────────────────────
  # These rules use metrics from the pgbouncer_exporter sidecar (port 9127).
  # They reflect the per-pod pool state BEFORE connections reach Postgres and
  # are the earliest signal of impending server connection exhaustion.
  #
  # Key metrics (from pgbouncer_exporter):
  #   pgbouncer_pools_server_active_connections  — server conns currently in use
  #   pgbouncer_pools_server_idle_connections    — server conns idle in pool
  #   pgbouncer_pools_client_waiting_connections — app clients queued for a conn
  #   pgbouncer_pools_maxwait_seconds            — longest wait time in queue
  #   pgbouncer_databases_pool_size              — configured pool_size per db
  - name: agri_fi_pgbouncer_pool
    interval: 15s
    rules:
      # ── Recording rule: per-pod server pool utilisation % (#1037) ──────────
      # agri_fi:pgbouncer_server_pool_pct  =
      #   active_server_conns / configured_pool_size × 100
      - record: agri_fi:pgbouncer_server_pool_pct
        expr: |
          (
            pgbouncer_pools_server_active_connections{database="agric_onchain"}
            /
            pgbouncer_databases_pool_size{database="agric_onchain"}
          ) * 100

      # ── Warning: per-pod pool above 85% utilised (#1037) ──────────────────
      - alert: PgBouncerServerPoolHighUsage
        expr: agri_fi:pgbouncer_server_pool_pct > 85
        for: 2m
        labels:
          severity: warning
          team: backend
          owner: backend-oncall
          runbook: "https://runbooks.internal/agri-fi/pgbouncer"
          component: pgbouncer
        annotations:
          summary: "PgBouncer server pool above 85% on {{ $labels.instance }}"
          description: >
            The pgbouncer sidecar on {{ $labels.instance }} is using
            {{ $value | printf "%.1f" }}% of its configured pool_size (20)
            for the agric_onchain database.
            At 85% × 20 = 17 active server connections per pod.
            If multiple pods are saturated simultaneously, RDS
            max_connections will be breached.
            Check: active query count, slow queries, replica count.
            Runbook: https://runbooks.internal/agri-fi/pgbouncer

      # ── Critical: per-pod pool above 95% (#1037) ──────────────────────────
      - alert: PgBouncerServerPoolCritical
        expr: agri_fi:pgbouncer_server_pool_pct > 95
        for: 1m
        labels:
          severity: critical
          team: backend
          owner: backend-oncall
          runbook: "https://runbooks.internal/agri-fi/pgbouncer"
          component: pgbouncer
          pagerduty: "true"
        annotations:
          summary: "PgBouncer server pool above 95% on {{ $labels.instance }}"
          description: >
            The pgbouncer sidecar on {{ $labels.instance }} is using
            {{ $value | printf "%.1f" }}% of its pool_size (20) for
            agric_onchain. New client connections will queue or be rejected.
            Immediate action:
              1. Check for long-running queries blocking server connections
              2. Review HPA — scale down if replicas > 8
              3. Reload pgbouncer config if pool_size has drifted from 20:
                 kubectl exec <pod> -c pgbouncer -- pgbouncer -R

      # ── Clients queuing for a connection (#1037) ───────────────────────────
      - alert: PgBouncerClientWaiting
        expr: |
          pgbouncer_pools_client_waiting_connections{database="agric_onchain"} > 10
        for: 1m
        labels:
          severity: warning
          team: backend
          owner: backend-oncall
          runbook: "https://runbooks.internal/agri-fi/pgbouncer"
          component: pgbouncer
        annotations:
          summary: "PgBouncer has {{ $value }} clients queued on {{ $labels.instance }}"
          description: >
            More than 10 application clients are waiting for a server
            connection from the pgbouncer pool on {{ $labels.instance }}.
            Queued clients: {{ $value }}.
            This indicates the pool_size (20) is fully consumed and requests
            are stacking up. API latency will spike. Check for slow queries
            holding server connections.

      # ── Client wait time spike (#1037) ────────────────────────────────────
      - alert: PgBouncerMaxWaitHigh
        expr: |
          pgbouncer_pools_maxwait_seconds{database="agric_onchain"} > 5
        for: 1m
        labels:
          severity: warning
          team: backend
          owner: backend-oncall
          runbook: "https://runbooks.internal/agri-fi/pgbouncer"
          component: pgbouncer
        annotations:
          summary: "PgBouncer client wait time above 5s on {{ $labels.instance }}"
          description: >
            The longest queued client on {{ $labels.instance }} has been
            waiting {{ $value | printf "%.1f" }}s for a server connection.
            API requests will appear to hang. At 30s+ TypeORM will time out.
            Check active queries and pool utilisation.

      # ── PgBouncer exporter down ────────────────────────────────────────────
      - alert: PgBouncerExporterDown
        expr: up{job="pgbouncer"} == 0
        for: 1m
        labels:
          severity: warning
          team: platform
          owner: platform-oncall
          component: pgbouncer
        annotations:
          summary: "PgBouncer exporter unreachable on {{ $labels.instance }}"
          description: >
            The pgbouncer_exporter sidecar on {{ $labels.instance }} has been
            unreachable for more than 1 minute. Per-pod pool utilisation
            alerts will not fire until restored. Verify the pgbouncer sidecar
            container is running: kubectl describe pod <pod> -n agri-fi

  - name: agri_fi_database_replication
    interval: 30s
    rules:
      # ── Read replica falling behind the primary (warning) ───────────────────
      - alert: DatabaseReplicationLagHigh
        expr: pg_replication_lag_seconds > 5
        for: 2m
        labels:
          severity: warning
          team: backend
          owner: backend-oncall
          runbook: "https://runbooks.internal/agri-fi/replica-lag"
        annotations:
          summary: "Read replica lag above 5 seconds"
          description: >
            Replica {{ $labels.instance }} is {{ $value | printf "%.1f" }}s
            behind the primary for more than 2 minutes. Reads routed to this
            replica may return stale data.

      # ── Read replica critically behind the primary ─────────────────────────
      - alert: DatabaseReplicationLagCritical
        expr: pg_replication_lag_seconds > 30
        for: 1m
        labels:
          severity: critical
          team: backend
          owner: backend-oncall
          runbook: "https://runbooks.internal/agri-fi/replica-lag"
          pagerduty: "true"
        annotations:
          summary: "Read replica lag critically high"
          description: >
            Replica {{ $labels.instance }} is {{ $value | printf "%.1f" }}s
            behind the primary for more than 1 minute.

  # ── Escrow Queue & DLQ Alerts (#847) ───────────────────────────────────────
  - name: agri_fi_escrow_queue
    interval: 15s
    rules:
      # ── Escrow queue depth warning (>500 for 5m) ───────────────────────────
      - alert: EscrowQueueDepthHigh
        expr: rabbitmq_queue_messages{queue="escrow.process"} > 500
        for: 5m
        labels:
          severity: warning
          team: backend
          owner: backend-oncall
          runbook: "docs/runbooks/escrow.md"
          component: escrow
        annotations:
          summary: "Escrow queue depth above 500"
          runbook_url: "docs/runbooks/escrow.md"
          description: >
            The escrow processing queue on {{ $labels.instance }} has exceeded
            500 pending messages for more than 5 minutes.
            Current depth: {{ $value }}.
            Consumer throughput may be insufficient to keep up with incoming
            investment confirmations. Check consumer health and scaling.
            See runbook: docs/runbooks/escrow.md

      # ── Escrow queue depth critical (>2000 for 2m) ─────────────────────────
      - alert: EscrowQueueDepthCritical
        expr: rabbitmq_queue_messages{queue="escrow.process"} > 2000
        for: 2m
        labels:
          severity: critical
          team: backend
          owner: backend-oncall
          runbook: "docs/runbooks/escrow.md"
          component: escrow
          pagerduty: "true"
        annotations:
          summary: "Escrow queue depth critically high (>2000)"
          runbook_url: "docs/runbooks/escrow.md"
          description: >
            The escrow processing queue on {{ $labels.instance }} has exceeded
            2000 pending messages for more than 2 minutes.
            Current depth: {{ $value }}.
            Escrow releases are significantly backlogged. Investors may
            experience delayed token delivery. Scale consumers immediately.
            See runbook: docs/runbooks/escrow.md

      # ── DLQ message count increased in last 15m ────────────────────────────
      - alert: DLQGrowing
        expr: increase(rabbitmq_queue_messages{queue="escrow.dlq"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
          team: backend
          owner: backend-oncall
          runbook: "docs/runbooks/escrow.md"
          component: escrow
        annotations:
          summary: "Dead-letter queue is accumulating messages"
          runbook_url: "docs/runbooks/escrow.md"
          description: >
            The escrow DLQ on {{ $labels.instance }} has received
            {{ $value }} new messages in the last 15 minutes.
            Failed escrow transactions are accumulating. Investigate
            root cause and use `npm run queue:retry-dlq` to retry.
            See runbook: docs/runbooks/escrow.md

      # ── DLQ has messages for more than 1h ──────────────────────────────────
      - alert: DLQNotEmpty
        expr: rabbitmq_queue_messages{queue="escrow.dlq"} > 0
        for: 1h
        labels:
          severity: critical
          team: backend
          owner: backend-oncall
          runbook: "docs/runbooks/escrow.md"
          component: escrow
          pagerduty: "true"
        annotations:
          summary: "Escrow DLQ has unprocessed messages for >1 hour"
          runbook_url: "docs/runbooks/escrow.md"
          description: >
            The escrow DLQ on {{ $labels.instance }} has {{ $value }}
            messages that have been sitting for more than 1 hour.
            These represent failed escrow settlements that require manual
            intervention. Run `npm run queue:retry-dlq` or investigate
            the root cause.
            See runbook: docs/runbooks/escrow.md

      # ── Consumer lag exceeds 100 for 10m ───────────────────────────────────
      - alert: EscrowConsumerLag
        expr: rabbitmq_queue_consumers{queue="escrow.process"} == 0
        for: 10m
        labels:
          severity: warning
          team: backend
          owner: backend-oncall
          runbook: "docs/runbooks/escrow.md"
          component: escrow
        annotations:
          summary: "Escrow consumer has no active consumers"
          runbook_url: "docs/runbooks/escrow.md"
          description: >
            The escrow processing queue on {{ $labels.instance }} has had
            zero active consumers for more than 10 minutes.
            Messages will accumulate in the queue. Verify the consumer
            service is running and healthy.
            See runbook: docs/runbooks/escrow.md

      # ── Stellar transaction failure rate (>5% in 5m) ───────────────────────
      - alert: StellarTxFailureRate
        expr: |
          (
            rate(escrow_stellar_tx_failures_total[5m])
            /
            rate(escrow_stellar_tx_total[5m])
          ) * 100 > 5
        for: 5m
        labels:
          severity: critical
          team: backend
          owner: backend-oncall
          runbook: "docs/runbooks/escrow.md"
          component: stellar
          pagerduty: "true"
        annotations:
          summary: "Stellar transaction failure rate above 5%"
          runbook_url: "docs/runbooks/escrow.md"
          description: >
            More than 5% of Stellar escrow transactions on
            {{ $labels.instance }} are failing.
            Failure rate: {{ $value | printf "%.1f" }}%.
            This may indicate network congestion, insufficient base fee,
            or contract invocation errors. Check Stellar network status
            and contract health.
            See runbook: docs/runbooks/escrow.md

      # ── Outbox stalled events (>50 pending for 10m) ────────────────────────
      - alert: OutboxStalledEvents
        expr: outbox_pending_count > 50
        for: 10m
        labels:
          severity: warning
          team: backend
          owner: backend-oncall
          runbook: "docs/runbooks/escrow.md"
          component: outbox
        annotations:
          summary: "Outbox has more than 50 pending events"
          runbook_url: "docs/runbooks/escrow.md"
          description: >
            The transactional outbox on {{ $labels.instance }} has
            {{ $value }} pending events for more than 10 minutes.
            Events are not being published to the message broker.
            Check the outbox relay process and RabbitMQ connectivity.
            See runbook: docs/runbooks/escrow.md

  # ── Stellar Horizon Failover Alerts ──────────────────────────────────────────
  - name: agri_fi_stellar_horizon
    interval: 30s
    rules:
      # ── All Horizon nodes are unhealthy (critical failover) ───────────────
      - alert: StellarHorizonAllNodesDown
        expr: |
          count(stellar_horizon_node_status{job="backend"} == 1)
          ==
          0
        for: 1m
        labels:
          severity: critical
          team: backend
          component: stellar
          pagerduty: "true"
        annotations:
          summary: "All Stellar Horizon nodes are unreachable"
          description: >
            All configured Horizon nodes on {{ $labels.instance }} have
            been unreachable for more than 1 minute. The backend cannot
            process any Stellar operations (transactions, account queries).
            Immediate action required:
            1. Check network connectivity to Horizon nodes
            2. Verify Stellar network status
            3. Check if nodes are rate-limiting the backend
            4. Consider using alternative Horizon endpoints

      # ── Horizon failover rate is elevated (multiple nodes failing) ──────
      - alert: StellarHorizonHighFailoverRate
        expr: |
          rate(stellar_horizon_failover_count[5m]) > 1
        for: 2m
        labels:
          severity: warning
          team: backend
          component: stellar
        annotations:
          summary: "Stellar Horizon nodes are failing over more than once per 5 minutes"
          description: >
            The backend is switching between Horizon nodes at an elevated
            rate (>1 failover per 5 minutes) on {{ $labels.instance }}.
            This indicates multiple nodes are experiencing issues.
            Recent failover rate: {{ $value | printf "%.2f" }} per minute.
            Investigate which nodes are failing and why:
            - Network latency or packet loss
            - Rate-limiting from Horizon
            - High backend request volume

      # ── Active node latency is degraded (>5s consistently) ──────────────
      - alert: StellarHorizonLatencyHigh
        expr: |
          stellar_horizon_active_node_latency_ms > 5000
        for: 5m
        labels:
          severity: warning
          team: backend
          component: stellar
        annotations:
          summary: "Stellar Horizon active node latency above 5 seconds"
          description: >
            The currently active Horizon node on {{ $labels.instance }}
            has been responding in over 5000ms for more than 5 minutes.
            Current latency: {{ $value | printf "%.0f" }}ms.
            This will slow down Stellar operations. Consider triggering
            a failover or investigating the node's health:
            - Check node CPU/memory usage
            - Verify network path latency
            - Consider rate-limiting from Horizon

      # ── Only one Horizon node is healthy (degraded state) ──────────────
      - alert: StellarHorizonDegraded
        expr: |
          count(stellar_horizon_node_status{job="backend"} == 1)
          ==
          1
        for: 3m
        labels:
          severity: warning
          team: backend
          component: stellar
        annotations:
          summary: "Stellar Horizon is in degraded state (only 1 node healthy)"
          description: >
            Only 1 out of {{ count(stellar_horizon_node_status{job="backend"}) }}
            Horizon nodes on {{ $labels.instance }} is currently healthy.
            The backend has no failover capacity. If the active node fails,
            all Stellar operations will be unavailable.
            Investigate why other nodes are unhealthy and restore them.

      # ── Horizon metrics exporter down (can't track status) ────────────────
      - alert: StellarMetricsDown
        expr: up{job="backend",service="stellar"} == 0
        for: 2m
        labels:
          severity: warning
          team: platform
          component: stellar
        annotations:
          summary: "Stellar metrics exporter is unreachable"
          description: >
            The Stellar metrics endpoint on {{ $labels.instance }} has
            been unreachable for more than 2 minutes. Horizon health
            alerts cannot be evaluated. Check backend service health.
