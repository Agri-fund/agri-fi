groups:
  - name: agri_fi_database_pool
    interval: 30s
    rules:

      # ── Active connections approaching pool capacity (warning at 80%) ──────
      - alert: DatabasePoolHighUsage
        expr: |
          (
            pg_stat_activity_count{datname="agri",state!="idle"}
            /
            pg_settings_max_connections
          ) * 100 > 80
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Database connection pool usage above 80%"
          description: >
            Active (non-idle) connections on instance {{ $labels.instance }} have
            been above 80% of max_connections for more than 2 minutes.
            Current usage: {{ $value | printf "%.1f" }}%.

      # ── Active connections exceeding 90% of pool capacity (critical) ───────
      - alert: DatabasePoolCriticalUsage
        expr: |
          (
            pg_stat_activity_count{datname="agri",state!="idle"}
            /
            pg_settings_max_connections
          ) * 100 > 90
        for: 1m
        labels:
          severity: critical
          team: backend
          pagerduty: "true"
        annotations:
          summary: "Database connection pool usage above 90% — API requests at risk"
          description: >
            Active (non-idle) connections on instance {{ $labels.instance }} have
            exceeded 90% of max_connections for more than 1 minute.
            Current usage: {{ $value | printf "%.1f" }}%.
            Immediate action required to prevent connection exhaustion.

      # ── Idle-in-transaction connections (long-running uncommitted txns) ────
      - alert: DatabaseIdleInTransactionConnections
        expr: |
          pg_stat_activity_count{datname="agri",state="idle in transaction"} > 5
        for: 3m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High number of idle-in-transaction connections"
          description: >
            {{ $value }} connections on {{ $labels.instance }} are in
            'idle in transaction' state for more than 3 minutes.
            These hold locks and count against max_connections.

      # ── Connection pool fully exhausted ────────────────────────────────────
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          pg_stat_activity_count{datname="agri",state!="idle"}
          >= pg_settings_max_connections
        for: 30s
        labels:
          severity: critical
          team: backend
          pagerduty: "true"
        annotations:
          summary: "Database connection pool exhausted — new connections will be rejected"
          description: >
            All {{ $value }} connections on {{ $labels.instance }} are in use.
            New API requests requiring a DB connection will fail immediately.

      # ── Exporter down (no metrics from postgres_exporter) ──────────────────
      - alert: DatabaseExporterDown
        expr: up{job="postgres_exporter"} == 0
        for: 1m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Postgres exporter is down — DB pool metrics unavailable"
          description: >
            The postgres_exporter instance {{ $labels.instance }} has been
            unreachable for more than 1 minute. Connection pool alerts may not fire.

  - name: agri_fi_rabbitmq_queues
    interval: 30s
    rules:

      # ── Queue depth warning: >100 messages for 5 minutes ─────────────────
      - alert: RabbitMQQueueDepthWarning
        expr: |
          rabbitmq_queue_messages{vhost="/"}  > 100
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "RabbitMQ queue {{ $labels.queue }} depth above 100 messages"
          description: >
            Queue {{ $labels.queue }} on vhost {{ $labels.vhost }} has had
            more than 100 unprocessed messages for over 5 minutes.
            Current depth: {{ $value }}. This may indicate a consumer crash
            or processing bottleneck.

      # ── Queue depth critical: >500 messages for 5 minutes ────────────────
      - alert: RabbitMQQueueDepthCritical
        expr: |
          rabbitmq_queue_messages{vhost="/"} > 500
        for: 5m
        labels:
          severity: critical
          team: backend
          pagerduty: "true"
        annotations:
          summary: "RabbitMQ queue {{ $labels.queue }} depth critically high (>500)"
          description: >
            Queue {{ $labels.queue }} on vhost {{ $labels.vhost }} has exceeded
            500 unprocessed messages for over 5 minutes.
            Current depth: {{ $value }}. Consumer processes may have crashed.
            Immediate investigation required.

      # ── No active consumers on a queue ───────────────────────────────────
      - alert: RabbitMQQueueNoConsumers
        expr: |
          rabbitmq_queue_consumers{vhost="/"} == 0
            and
          rabbitmq_queue_messages{vhost="/"} > 0
        for: 2m
        labels:
          severity: critical
          team: backend
          pagerduty: "true"
        annotations:
          summary: "RabbitMQ queue {{ $labels.queue }} has no consumers"
          description: >
            Queue {{ $labels.queue }} on vhost {{ $labels.vhost }} has
            {{ $value }} messages pending but zero active consumers.
            The consumer process has likely crashed or disconnected.

      # ── Messages being published but not consumed (growing backlog) ───────
      - alert: RabbitMQQueueGrowingBacklog
        expr: |
          increase(rabbitmq_queue_messages{vhost="/"}[10m]) > 50
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "RabbitMQ queue {{ $labels.queue }} backlog is growing"
          description: >
            Queue {{ $labels.queue }} on vhost {{ $labels.vhost }} grew by
            more than 50 messages in the last 10 minutes and continues to grow.
            Consumer throughput may be insufficient for current load.

      # ── RabbitMQ node down ────────────────────────────────────────────────
      - alert: RabbitMQNodeDown
        expr: up{job="rabbitmq"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
          pagerduty: "true"
        annotations:
          summary: "RabbitMQ node is unreachable — metrics unavailable"
          description: >
            The RabbitMQ Prometheus endpoint at {{ $labels.instance }} has
            been unreachable for more than 1 minute.
            All queue-depth alerts may be suppressed while the node is down.