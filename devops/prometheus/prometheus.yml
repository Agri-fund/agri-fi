global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  # ── RabbitMQ Prometheus plugin (port 15692) ──────────────────────────────
  - job_name: rabbitmq
    static_configs:
      - targets:
          - rabbitmq:15692
    metrics_path: /metrics
    scrape_interval: 15s

  # ── Backend NestJS metrics (prom-client /metrics endpoint) ──────────────
  - job_name: backend
    static_configs:
      - targets:
          - backend:3001
    metrics_path: /metrics
    scrape_interval: 15s

  # ── Prometheus self-monitoring ───────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
