global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  # ── RabbitMQ Prometheus plugin (port 15692) ──────────────────────────────
  - job_name: rabbitmq
    static_configs:
      - targets:
          - rabbitmq:15692
    metrics_path: /metrics
    scrape_interval: 15s

  # ── Backend NestJS metrics (prom-client /metrics endpoint) ──────────────
  - job_name: backend
    static_configs:
      - targets:
          - backend:3001
    metrics_path: /metrics
    scrape_interval: 15s

  # ── PgBouncer metrics (pgbouncer_exporter sidecar, port 9127) ───────────
  # Each backend pod runs a pgbouncer_exporter sidecar that exposes PgBouncer
  # internal stats (pool utilisation, active connections, queue depth, etc.)
  # on port 9127.  Kubernetes pod annotations drive scraping in clusters with
  # the Prometheus Kubernetes SD; the static config below covers the local
  # docker-compose dev environment.
  #
  # Exposed metrics include (non-exhaustive):
  #   pgbouncer_stats_total_requests_total   — total query/transaction count
  #   pgbouncer_stats_total_received_bytes   — bytes received from clients
  #   pgbouncer_pools_client_active_connections — active client connections
  #   pgbouncer_pools_client_waiting_connections — clients waiting for a conn
  #   pgbouncer_pools_server_active_connections  — active server connections
  #   pgbouncer_pools_server_idle_connections    — idle server connections
  #   pgbouncer_pools_maxwait_seconds            — longest client wait time
  - job_name: pgbouncer
    static_configs:
      - targets:
          - backend:9127
    metrics_path: /metrics
    scrape_interval: 15s

  # ── Prometheus self-monitoring ───────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # ── Postgres exporter (#1037) ─────────────────────────────────────────────
  # postgres_exporter exposes pg_stat_activity, pg_settings_max_connections,
  # and replication lag metrics used by the agri_fi_database_pool alert group.
  # In-cluster the exporter runs as a separate Deployment and is discovered via
  # pod annotations; the static config below covers local docker-compose dev.
  #
  # Required env vars for the exporter:
  #   DATA_SOURCE_NAME=postgresql://<user>:<pass>@agri-fi-postgres:5432/agric_onchain?sslmode=disable
  - job_name: postgres_exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
    metrics_path: /metrics
    scrape_interval: 15s
