groups:
  - name: agri_fi_escrow_reconciliation
    interval: 30s
    rules:
      - alert: EscrowUnreconciledEvents
        expr: |
          (
            increase(escrow_reconciliation_failures_total[5m]) > 0
            or
            escrow_unreconciled_events_total > 0
          )
        for: 5m
        labels:
          severity: critical
          team: backend
          component: escrow
          pagerduty: "true"
        annotations:
          summary: "Unreconciled escrow events detected"
          description: >
            On-chain Stellar escrow release succeeded but database reconciliation
            has unreconciled events. Immediate investigation required to prevent
            inconsistent investor and farmer payout records.
          runbook_url: "docs/runbooks/escrow.md"
