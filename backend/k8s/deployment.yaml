---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agri-fi-backend-config
  labels:
    app: agri-fi-backend
data:
  NODE_ENV: "production"
  PORT: "3001"
  LOG_LEVEL: "info"
  LOG_PRETTY: "false"
  # PgBouncer sidecar runs on localhost:6432 — app connects here, not to
  # postgres:5432 directly.  Real Postgres host/port are used by PgBouncer
  # itself (injected into the sidecar via env vars above).
  DATABASE_HOST: "localhost"
  DATABASE_PORT: "6432"
  DATABASE_NAME: "agric_onchain"
  # Kept for reference / legacy code paths that read individual vars.
  # Canonical upstream Postgres is still accessible via the service name.
  DATABASE_UPSTREAM_HOST: "postgres"
  DATABASE_UPSTREAM_PORT: "5432"
  RABBITMQ_URL: "amqp://rabbitmq:5672"
  STELLAR_NETWORK: "testnet"
  STELLAR_HORIZON_URL: "https://horizon-testnet.stellar.org"
  ALLOWED_ORIGINS: "http://agri-fi-frontend"
  ALLOWED_HOSTS: "agri-fi.local,api.agri-fi.local"
  IPFS_GATEWAY: "https://api.web3.storage"
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "your-s3-bucket-name"
