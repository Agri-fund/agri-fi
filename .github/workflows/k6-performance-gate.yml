name: k6 Load Test CI Performance Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'tests/load/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  performance-gate:
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-perf-gate') && !contains(github.event.pull_request.labels.*.name, 'infra-only')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69 || true
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6 || true

      - name: Run k6 Performance Test Suite with Thresholds
        id: k6-suite
        run: |
          mkdir -p test-results
          k6 run tests/load/k6-performance.js --summary-export=test-results/k6-summary.json || echo "k6 execution completed"

      - name: Run Full Investor Journey Scenario
        id: k6-investor-journey
        run: |
          mkdir -p test-results
          k6 run tests/load/k6-investor-journey.js \
            --summary-export=test-results/k6-investor-journey-summary.json

      - name: Run Escrow Release Stress Scenario (50 concurrent releases)
        id: k6-escrow-stress
        run: |
          mkdir -p test-results
          k6 run tests/load/k6-escrow-stress.js \
            --summary-export=test-results/k6-escrow-stress-summary.json

      - name: Run Marketplace Browse Scenario (200 VU with filters)
        id: k6-marketplace-browse
        run: |
          mkdir -p test-results
          k6 run tests/load/k6-marketplace-browse.js \
            --summary-export=test-results/k6-marketplace-browse-summary.json

      - name: Enforce p95 Thresholds
        if: always()
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const READ_P95_MS = 500;
          const WRITE_P95_MS = 2000;

          const summaries = [
            'test-results/k6-summary.json',
            'test-results/k6-investor-journey-summary.json',
            'test-results/k6-escrow-stress-summary.json',
            'test-results/k6-marketplace-browse-summary.json',
          ];

          const readPatterns = [/^http_req_duration\{.*(GET|browse|portfolio|marketplace|deals).*\}$/i, /^http_req_duration\{.*status.*\}$/i];
          const writePatterns = [/^http_req_duration\{.*(POST|PUT|PATCH|invest|register|kyc|escrow|release).*\}$/i];

          const isRead = (name) => readPatterns.some((re) => re.test(name));
          const isWrite = (name) => writePatterns.some((re) => re.test(name));

          let failures = [];
          let checked = 0;

          for (const file of summaries) {
            if (!fs.existsSync(file)) {
              console.log(`::warning::Summary file not found: ${file}`);
              continue;
            }
            let data;
            try {
              data = JSON.parse(fs.readFileSync(file, 'utf8'));
            } catch (err) {
              console.log(`::warning::Could not parse ${file}: ${err.message}`);
              continue;
            }
            const metrics = data.metrics || {};
            for (const [name, metric] of Object.entries(metrics)) {
              if (!name.startsWith('http_req_duration')) continue;
              const values = metric.values || {};
              const p95 = values['p(95)'];
              if (typeof p95 !== 'number') continue;

              let limit = null;
              let kind = null;
              if (isWrite(name)) {
                limit = WRITE_P95_MS;
                kind = 'write';
              } else if (isRead(name)) {
                limit = READ_P95_MS;
                kind = 'read';
              }
              if (limit === null) continue;

              checked++;
              if (p95 > limit) {
                failures.push(`${file} :: ${name} (${kind}) p95=${p95.toFixed(1)}ms exceeds ${limit}ms`);
              }
            }
          }

          console.log(`Checked ${checked} p95 metric(s) against thresholds.`);
          if (failures.length > 0) {
            for (const f of failures) {
              console.log(`::error::${f}`);
            }
            console.error(`\n${failures.length} threshold breach(es) detected.`);
            process.exit(1);
          }
          console.log('All p95 thresholds satisfied.');
          EOF

      - name: Archive Performance Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-summary
          path: test-results/*.json

      - name: Post Results Summary as PR Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = [
              { label: 'Baseline Suite', file: 'test-results/k6-summary.json' },
              { label: 'Full Investor Journey', file: 'test-results/k6-investor-journey-summary.json' },
              { label: 'Escrow Release Stress (50 concurrent)', file: 'test-results/k6-escrow-stress-summary.json' },
              { label: 'Marketplace Browse (200 VU, filters)', file: 'test-results/k6-marketplace-browse-summary.json' },
            ];

            const READ_P95_MS = 500;
            const WRITE_P95_MS = 2000;

            const readPatterns = [/^http_req_duration\{.*(GET|browse|portfolio|marketplace|deals).*\}$/i, /^http_req_duration\{.*status.*\}$/i];
            const writePatterns = [/^http_req_duration\{.*(POST|PUT|PATCH|invest|register|kyc|escrow|release).*\}$/i];
            const isRead = (name) => readPatterns.some((re) => re.test(name));
            const isWrite = (name) => writePatterns.some((re) => re.test(name));

            let lines = [];
            lines.push('## k6 Load Test Performance Gate');
            lines.push('');
            lines.push('| Scenario | Metric | p95 (ms) | Threshold (ms) | Status |');
            lines.push('| --- | --- | ---: | ---: | :---: |');

            let breaches = 0;
            let anyData = false;

            for (const { label, file } of files) {
              if (!fs.existsSync(file)) {
                lines.push(`| ${label} | _summary missing_ | - | - | ⚠️ |`);
                continue;
              }
              let data;
              try {
                data = JSON.parse(fs.readFileSync(file, 'utf8'));
              } catch (err) {
                lines.push(`| ${label} | _parse error_ | - | - | ⚠️ |`);
                continue;
              }
              const metrics = data.metrics || {};
              let scenarioRows = 0;
              for (const [name, metric] of Object.entries(metrics)) {
                if (!name.startsWith('http_req_duration')) continue;
                const p95 = (metric.values || {})['p(95)'];
                if (typeof p95 !== 'number') continue;

                let limit = null;
                if (isWrite(name)) limit = WRITE_P95_MS;
                else if (isRead(name)) limit = READ_P95_MS;
                if (limit === null) continue;

                const ok = p95 <= limit;
                if (!ok) breaches++;
                scenarioRows++;
                anyData = true;
                lines.push(`| ${label} | \`${name}\` | ${p95.toFixed(1)} | ${limit} | ${ok ? '✅' : '❌'} |`);
              }
              if (scenarioRows === 0) {
                lines.push(`| ${label} | _no matching metrics_ | - | - | ⚠️ |`);
              }
            }

            lines.push('');
            if (breaches > 0) {
              lines.push(`**Result:** ❌ ${breaches} threshold breach(es) detected.`);
            } else if (anyData) {
              lines.push('**Result:** ✅ All p95 thresholds satisfied.');
            } else {
              lines.push('**Result:** ⚠️ No threshold metrics were collected.');
            }
            lines.push('');
            lines.push('_Thresholds: reads p95 < 500 ms, writes p95 < 2 s._');

            const body = lines.join('\n');
            const marker = '## k6 Load Test Performance Gate';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }