name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
        postgres-version: [16, 17]

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: agri
          POSTGRES_PASSWORD: agri
          POSTGRES_DB: agri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://agri:agri@localhost:5432/agri_test
      JWT_SECRET: ci-test-secret
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_PLATFORM_SECRET: ${{ secrets.STELLAR_PLATFORM_SECRET_TESTNET }}
      STELLAR_INTEGRATION_TESTS: ${{ secrets.STELLAR_PLATFORM_SECRET_TESTNET != '' && 'true' || 'false' }}
      ENCRYPTION_KEY: ci-test-encryption-key-32chars!!
      RABBITMQ_URL: amqp://localhost:5672
      REDIS_URL: redis://localhost:6379
      NOTIFICATIONS_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Backend - Lint changed TypeScript files
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed_files=()
          while IFS= read -r file; do
            if [[ "$file" == backend/*.ts ]]; then
              changed_files+=("${file#backend/}")
            fi
          done < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.ts')

          if ((${#changed_files[@]} == 0)); then
            echo "No changed backend TypeScript files; skipping backend lint."
          else
            npx eslint "${changed_files[@]}" --max-warnings=0
          fi
        working-directory: backend

      - name: Check ER Diagram Freshness
        run: |
          npm run doc:diagram
          git diff --exit-code docs/database/schema.md || (echo "DB schema ER diagram is out of date! Run 'npm run doc:diagram' and commit changes." && exit 1)

      - name: Backend - Verify .env.example coverage
        run: npm run check:env
        working-directory: backend

      - name: Backend - Verify .env.example schema sync
        run: npm run check:env-schema
        working-directory: backend

      - name: Run database migrations
        run: npm run migration:run
        working-directory: backend
        env:
          DATABASE_URL: postgres://agri:agri@localhost:5432/agri_test

      - name: Backend - Test
        run: npm test -- --passWithNoTests
        working-directory: backend

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Frontend - Lint
        run: pnpm run lint
        working-directory: frontend

      - name: Frontend - Test
        run: pnpm run test -- --passWithNoTests
        working-directory: frontend
