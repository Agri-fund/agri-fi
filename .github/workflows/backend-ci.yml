name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend — lint, build, test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
        postgres-version: [16, 17]

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: agri
          POSTGRES_PASSWORD: agri
          POSTGRES_DB: agri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://agri:agri@localhost:5432/agri_test
      JWT_SECRET: ci-test-secret
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_PLATFORM_SECRET: ${{ secrets.STELLAR_PLATFORM_SECRET_TESTNET }}
      STELLAR_INTEGRATION_TESTS: ${{ secrets.STELLAR_PLATFORM_SECRET_TESTNET != '' && 'true' || 'false' }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      ENCRYPTION_KEY: ci-test-encryption-key-32chars!!
      RABBITMQ_URL: amqp://localhost:5672
      NOTIFICATIONS_ENABLED: "false"
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Check for unresolved merge conflicts
        run: |
          if grep -rn "<<<<<<< " --include="*.ts" --include="*.tsx" --include="*.json" .; then
            echo "Unresolved merge conflicts found!"
            exit 1
          fi
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Check Stellar testnet secret
        run: |
          if [ -z "${STELLAR_PLATFORM_SECRET}" ]; then
            echo "::notice title=Stellar integration tests disabled::STELLAR_PLATFORM_SECRET_TESTNET is not configured. Tests that require Stellar testnet access should skip when STELLAR_INTEGRATION_TESTS=false."
          else
            echo "Stellar testnet keypair configured for CI."
          fi

      - name: Verify lockfile
        run: npm ci --dry-run
        working-directory: backend

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Lint
        run: npm run lint -- --max-warnings=0
        working-directory: backend

      - name: Verify .env.example coverage
        run: npm run check:env
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend

      - name: Generate OpenAPI spec
        run: node generate-openapi.js
        working-directory: backend
        env:
          NODE_ENV: development
          PORT: '0'
          DATABASE_URL: postgresql://localhost/dummy
          JWT_SECRET: dummy-secret-for-spec-generation
          RABBITMQ_URL: amqp://localhost:5672
          LOG_LEVEL: error

      - name: Check OpenAPI spec drift (PR only)
        if: github.event_name == 'pull_request'
        run: |
          if ! diff -u backend/openapi.json <(git show HEAD:backend/openapi.json) > /tmp/openapi.diff 2>/dev/null; then
            echo "::error::OpenAPI spec drift detected. Run 'npm run generate-openapi' and commit changes."
            cat /tmp/openapi.diff
            exit 1
          fi

      - name: Upload OpenAPI spec artifact
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec-pr-${{ github.event.pull_request.number }}
          path: backend/openapi.json
          retention-days: 30

      - name: Comment PR with OpenAPI changes
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Get the diff
            let diff = '';
            try {
              const { execSync } = require('child_process');
              diff = execSync(`diff -u backend/openapi.json <(git show HEAD:backend/openapi.json) 2>/dev/null || true`, {
                cwd: process.env.GITHUB_WORKSPACE,
                encoding: 'utf-8',
                shell: '/bin/bash'
              }).trim();
            } catch (e) {
              // If diff fails (file doesn't exist in HEAD), that's OK
            }

            if (!diff) {
              core.info('No OpenAPI changes detected');
              return;
            }

            // Parse diff to count additions/deletions
            const lines = diff.split('\n');
            const additions = lines.filter(l => l.startsWith('+')).length;
            const deletions = lines.filter(l => l.startsWith('-')).length;

            // Extract breaking changes (removed paths or changed methods)
            const breaking = [];
            const added = [];
            const modified = [];

            for (let i = 0; i < lines.length; i++) {
              const line = lines[i];
              if (line.startsWith('-    "/') && !lines[i+1]?.startsWith('+')) {
                breaking.push(line.slice(6, -3)); // extract path
              } else if (line.startsWith('+    "/')) {
                added.push(line.slice(6, -3));
              }
            }

            let comment = '## 📋 OpenAPI Spec Changes\n\n';
            comment += `**Additions:** ${additions} | **Deletions:** ${deletions}\n\n`;

            if (breaking.length > 0) {
              comment += '### ⚠️ Breaking Changes\n';
              breaking.forEach(p => comment += `- \`${p}\`\n`);
              comment += '\n';
            }

            if (added.length > 0) {
              comment += '### ✨ New Endpoints\n';
              added.forEach(p => comment += `- \`${p}\`\n`);
              comment += '\n';
            }

            comment += '[View full spec diff](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Run database migrations
        run: npm run migration:run
        working-directory: backend
        env:
          DATABASE_URL: postgres://agri:agri@localhost:5432/agri_test

      - name: Test
        run: npm test -- --forceExit --passWithNoTests --coverage --detectOpenHandles
        working-directory: backend

      - name: E2E — SEP-24 withdrawal flow
        run: npm run test:e2e -- --forceExit --detectOpenHandles --testPathPattern "sep24-withdrawal.e2e-spec"
        working-directory: backend

      - name: Check coverage thresholds
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "Coverage Report:"
            cat coverage/coverage-summary.json | jq '.total'
          fi
        working-directory: backend

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        if: ${{ always() && env.SONAR_HOST_URL != '' }}
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=agri-fi-backend
            -Dsonar.projectName="Agri-Fi Backend"
            -Dsonar.sources=backend/src
            -Dsonar.tests=backend/src
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts
            -Dsonar.typescript.lcov.reportPaths=backend/coverage/lcov.info
            -Dsonar.qualitygate.wait=true

      - name: Notify on failure
        if: failure()
        run: |
          # Discord notification
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} \
              -H "Content-Type: application/json" \
              -d '{
                "content": "❌ **Backend CI Build Failed**\n\n**Repository:** ${{ github.repository }}\n**Branch:** ${{ github.ref_name }}\n**Commit:** ${{ github.sha }}\n**Actor:** ${{ github.actor }}\n**Workflow:** ${{ github.workflow }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "username": "GitHub Actions"
              }' || true
          fi

          # Slack notification
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
              -H "Content-Type: application/json" \
              -d '{
                "text": "❌ Backend CI Build Failed",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "❌ Backend CI Build Failed"
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Repository:*\n${{ github.repository }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Branch:*\n${{ github.ref_name }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Commit:*\n${{ github.sha }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Actor:*\n${{ github.actor }}"
                      }
                    ]
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                    }
                  }
                ]
              }' || true
          fi
