name: Secret Scanner

on:
  pull_request:
    branches: [main, develop, test-coverage-enforcement]
  push:
    branches: [main, develop, test-coverage-enforcement]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan-secrets:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history to catch secrets in commits

      - name: TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --json
        continue-on-error: true

      - name: Check for secrets in diff
        run: |
          # Install trufflehog
          pip install trufflehog

          # Get the merge base
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
            HEAD_REF="${{ github.event.pull_request.head.sha }}"
          else
            BASE_REF="${{ github.event.before }}"
            HEAD_REF="${{ github.event.after }}"
          fi

          echo "Scanning commits between $BASE_REF and $HEAD_REF"

          # Run trufflehog on the commit range
          trufflehog git file://./ --json \
            --fail \
            --since-commit "$BASE_REF" \
            2>&1 | tee trufflehog-output.json || SECRET_SCAN_FAILED=true

          if [ "$SECRET_SCAN_FAILED" = true ]; then
            echo "::error::Secret patterns detected in commits. Please review and remove sensitive data."
            exit 1
          fi

      - name: Report findings
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Security Alert**: Potential secrets detected in this PR.\n\n' +
                    '❌ This PR cannot be merged until all secrets are removed from the commit history.\n\n' +
                    '**What to do:**\n' +
                    '1. Review the failed workflow for details\n' +
                    '2. Check your commits for accidentally committed credentials (keys, tokens, passwords)\n' +
                    '3. Use `git filter-branch` or `git rebase` to remove secrets\n' +
                    '4. Force push your branch (only for your own branches)\n\n' +
                    '**Resources:**\n' +
                    '- [Remove Secrets from Git History](https://github.com/trufflesecurity/trufflehog)\n' +
                    '- [Git Credential Management](https://git-scm.com/book/en/v2/Git-Tools-Credential-Storage)\n'
            })
