name: OWASP ZAP API Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  zap-scan:
    name: OWASP ZAP Dynamic Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: agri
          POSTGRES_PASSWORD: agri
          POSTGRES_DB: agri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://agri:agri@localhost:5432/agri_test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USER: agri
      DATABASE_PASSWORD: agri
      DATABASE_NAME: agri_test
      JWT_SECRET: zap-scan-secret
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_PLATFORM_SECRET: ${{ secrets.STELLAR_PLATFORM_SECRET_TESTNET }}
      ENCRYPTION_KEY: zap-scan-encryption-key-32chars!!
      RABBITMQ_URL: amqp://localhost:5672
      NOTIFICATIONS_ENABLED: "false"
      PORT: 3001
      KMS_KEY_ID: alias/ci-zap-scan-kms-key
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run database migrations
        run: npm run migration:run
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Start backend API in background
        run: |
          npm run start:prod > /tmp/backend-zap.log 2>&1 &
          echo $! > /tmp/backend-zap.pid
        working-directory: backend

      - name: Wait for backend to be ready
        run: |
          for i in {1..90}; do
            if curl -s http://localhost:3001/health > /dev/null || \
               curl -s http://localhost:3001/v1/health > /dev/null; then
              echo "Backend is ready!"
              exit 0
            fi
            echo "Waiting for backend to be ready... ($i/90)"
            sleep 1
          done
          echo "Backend failed to start in time"
          echo "---- backend log ----"
          cat /tmp/backend-zap.log || true
          exit 1

      - name: OWASP ZAP Scan
        # Fork PRs get a read-only token that cannot create artifacts; the action
        # still fails the step after a clean scan when artifact upload 400s.
        # fail_action=warn already treats findings as non-fatal — keep going.
        continue-on-error: true
        uses: zaproxy/action-full-scan@v0.11.0
        with:
          target: "http://localhost:3001"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
          allow_issue_writing: false
          artifact_name: zap_scan_${{ github.run_id }}
          fail_action: "warn"

      - name: Upload ZAP Report as Artifact
        uses: actions/upload-artifact@v4
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        with:
          name: zap-security-report-${{ github.run_id }}
          path: zap-full-scan-report*
          retention-days: 30

      # Note: `zaproxy/action-sarif` does not exist on GitHub and caused the whole
      # job to fail at action-resolution time before the scan could run.
