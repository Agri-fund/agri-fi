name: OWASP ZAP API Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  zap-scan:
    name: OWASP ZAP Dynamic Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: agri
          POSTGRES_PASSWORD: agri
          POSTGRES_DB: agri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://agri:agri@localhost:5432/agri_test
      JWT_SECRET: zap-scan-secret
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_PLATFORM_SECRET: ${{ secrets.STELLAR_PLATFORM_SECRET_TESTNET }}
      ENCRYPTION_KEY: zap-scan-encryption-key-32chars!!
      RABBITMQ_URL: amqp://localhost:5672
      NOTIFICATIONS_ENABLED: "false"
      PORT: 3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run database migrations
        run: npm run migration:run
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Start backend API in background
        run: npm run start:prod &
        working-directory: backend

      - name: Wait for backend to be ready
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:3001/health > /dev/null; then
              echo "Backend is ready!"
              exit 0
            fi
            echo "Waiting for backend to be ready... ($i/60)"
            sleep 1
          done
          echo "Backend failed to start in time"
          exit 1

      - name: OWASP ZAP Scan
        uses: zaproxy/action-full-scan@v0.11.0
        with:
          target: "http://localhost:3001"
          rules_file_name: ".zap/rules.tsv"  # Optional: custom rules
          cmd_options: "-a"                  # Include alpha rules
          allow_issue_writing: false
          artifact_name: "zap-scan-report"
          fail_action: "warn"

      - name: Upload ZAP Report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-report
          path: zap-full-scan-report*
          retention-days: 30

      - name: Convert ZAP Report to SARIF (for GitHub Security tab)
        uses: zaproxy/action-sarif@v0.3.0
        if: always()

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: zap-full-scan-report.sarif
          category: "owasp-zap"
