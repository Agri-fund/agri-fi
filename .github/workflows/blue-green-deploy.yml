name: Blue-Green Deploy

# Full blue-green deployment workflow with health checks, canary support,
# automated rollback, smoke tests, SLI monitoring, and deployment analytics.
#
# This workflow is designed to be called from the main CD pipeline or triggered
# manually with custom parameters for production deployments.
#
# Required secrets:
#   KUBE_CONFIG_PRODUCTION  — base64-encoded kubeconfig for the production cluster
#   KUBE_CONFIG_STAGING     — base64-encoded kubeconfig for the staging cluster
#   DISCORD_WEBHOOK_URL     — optional Discord deployment notifications
#   SLACK_WEBHOOK_URL       — optional Slack deployment notifications
#
# Required variables (or defaults apply):
#   CANARY_STEPS    — comma-separated weight percentages (default: 10,25,50,75,100)
#   CANARY_INTERVAL — seconds to observe at each canary step (default: 120)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to latest main SHA)"
        required: false
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]
        default: staging
      canary:
        description: "Use canary (gradual traffic shift) instead of instant flip"
        required: false
        type: boolean
        default: false
      canary_steps:
        description: "Canary weight steps (comma-separated percentages)"
        required: false
        default: "10,25,50,75,100"
      canary_interval:
        description: "Seconds to observe at each canary step"
        required: false
        default: "120"
      dry_run:
        description: "Dry run — print actions without applying"
        required: false
        type: boolean
        default: false

  # Also callable from other workflows (e.g. cd.yml).
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      environment:
        required: true
        type: string
      canary:
        required: false
        type: boolean
        default: false
    secrets:
      KUBE_CONFIG_PRODUCTION:
        required: false
      KUBE_CONFIG_STAGING:
        required: false
      DISCORD_WEBHOOK_URL:
        required: false
      SLACK_WEBHOOK_URL:
        required: false

concurrency:
  group: blue-green-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # ── Resolve image coordinates ───────────────────────────────────────────────
  prepare:
    name: Resolve image
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.vars.outputs.image_prefix }}
      tag: ${{ steps.vars.outputs.tag }}
      namespace: ${{ steps.vars.outputs.namespace }}
    steps:
      - id: vars
        run: |
          PREFIX="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAG="${{ inputs.image_tag || github.sha }}"
          TAG="${TAG::12}"
          NS="agri-fi"
          [[ "${{ inputs.environment }}" == "production" ]] && NS="agri-fi-production"
          [[ "${{ inputs.environment }}" == "staging" ]]    && NS="agri-fi-staging"
          echo "image_prefix=${PREFIX}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"             >> "$GITHUB_OUTPUT"
          echo "namespace=${NS}"        >> "$GITHUB_OUTPUT"

  # ── Determine active/inactive slot ─────────────────────────────────────────
  slot-detection:
    name: Detect active slot
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.detect.outputs.active }}
      inactive: ${{ steps.detect.outputs.inactive }}
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > "$HOME/.kube/config"
          else
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"
          fi

      - name: Detect active slot
        id: detect
        run: |
          NS="${{ needs.prepare.outputs.namespace }}"
          ACTIVE=$(kubectl -n "$NS" get svc agri-fi-backend \
            -o jsonpath='{.spec.selector.slot}' 2>/dev/null || echo "blue")
          [[ "$ACTIVE" == "green" ]] && INACTIVE="blue" || INACTIVE="green"
          echo "active=${ACTIVE}"   >> "$GITHUB_OUTPUT"
          echo "inactive=${INACTIVE}" >> "$GITHUB_OUTPUT"
          echo "Active slot: ${ACTIVE} → will deploy to: ${INACTIVE}"

  # ── Deploy image to inactive slot ──────────────────────────────────────────
  deploy-inactive:
    name: Deploy to inactive slot (${{ needs.slot-detection.outputs.inactive }})
    needs: [prepare, slot-detection]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      deploy_status: ${{ steps.rollout.outputs.status }}
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > "$HOME/.kube/config"
          else
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"
          fi

      - name: Scale up inactive slot
        run: |
          NS="${{ needs.prepare.outputs.namespace }}"
          SLOT="${{ needs.slot-detection.outputs.inactive }}"
          kubectl -n "$NS" scale "deployment/agri-fi-backend-${SLOT}" --replicas=2
          echo "Scaled up agri-fi-backend-${SLOT}"

      - name: Update image on inactive slot
        run: |
          NS="${{ needs.prepare.outputs.namespace }}"
          SLOT="${{ needs.slot-detection.outputs.inactive }}"
          IMAGE="${{ needs.prepare.outputs.image_prefix }}/backend:${{ needs.prepare.outputs.tag }}"
          kubectl -n "$NS" set image "deployment/agri-fi-backend-${SLOT}" "backend=${IMAGE}"
          echo "Updated agri-fi-backend-${SLOT} → ${IMAGE}"

      - name: Wait for rollout
        id: rollout
        run: |
          NS="${{ needs.prepare.outputs.namespace }}"
          SLOT="${{ needs.slot-detection.outputs.inactive }}"
          if kubectl -n "$NS" rollout status "deployment/agri-fi-backend-${SLOT}" --timeout=180s; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  # ── Health checks on new slot ──────────────────────────────────────────────
  health-check:
    name: Health check (${{ needs.slot-detection.outputs.inactive }})
    needs: [prepare, slot-detection, deploy-inactive]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      health_status: ${{ steps.health.outputs.status }}
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > "$HOME/.kube/config"
          else
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"
          fi

      - name: Run health checks
        id: health
        run: |
          NS="${{ needs.prepare.outputs.namespace }}"
          SLOT="${{ needs.slot-detection.outputs.inactive }}"
          SVC="agri-fi-backend-${SLOT}-internal"
          JOB="health-check-${SLOT}-${GITHUB_SHA::8}"

          # Brief grace period after rollout.
          sleep 10

          if kubectl -n "$NS" run "$JOB" \
            --rm -i --restart=Never \
            --timeout=120s \
            --image=curlimages/curl:latest \
            --command -- sh -c "
              curl -fsS --retry 15 --retry-delay 3 --retry-connrefused \
                http://${SVC}/health && echo 'Health check: OK'
            "; then
            echo "status=healthy" >> "$GITHUB_OUTPUT"
          else
            echo "status=unhealthy" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  # ── Smoke tests on new slot ────────────────────────────────────────────────
  smoke-tests:
    name: Smoke tests (${{ needs.slot-detection.outputs.inactive }})
    needs: [prepare, slot-detection, health-check]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      smoke_status: ${{ steps.smoke.outputs.status }}
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > "$HOME/.kube/config"
          else
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"
          fi

      - name: Run smoke tests
        id: smoke
        env:
          NS: ${{ needs.prepare.outputs.namespace }}
          SLOT: ${{ needs.slot-detection.outputs.inactive }}
        run: |
          SVC="agri-fi-backend-${SLOT}-internal"
          JOB="smoke-test-${SLOT}-${GITHUB_SHA::8}"

          if kubectl -n "$NS" run "$JOB" \
            --rm -i --restart=Never \
            --timeout=300s \
            --image=curlimages/curl:latest \
            --command -- sh -c "
              set -e
              BASE=http://${SVC}

              echo '=== Smoke Tests: slot=${SLOT} ==='

              echo '[1/5] /health'
              curl -fsS --retry 10 --retry-delay 3 '\${BASE}/health'
              echo 'PASS'

              echo '[2/5] /v1/trade-deals'
              curl -fsS --max-time 10 '\${BASE}/v1/trade-deals' > /dev/null
              echo 'PASS'

              echo '[3/5] /v1/prices/commodities'
              curl -fsS --max-time 10 '\${BASE}/v1/prices/commodities' > /dev/null
              echo 'PASS'

              echo '[4/5] /v1/prices/fx'
              curl -fsS --max-time 10 '\${BASE}/v1/prices/fx' > /dev/null
              echo 'PASS'

              echo '[5/5] /metrics (Prometheus endpoint)'
              curl -fsS --max-time 10 '\${BASE}/metrics' > /dev/null
              echo 'PASS'

              echo '=== All smoke tests PASSED ==='
            "; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  # ── Canary traffic shift (optional) ───────────────────────────────────────
  canary-shift:
    name: Canary traffic shift
    needs: [prepare, slot-detection, smoke-tests]
    if: ${{ inputs.canary == true || inputs.canary == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > "$HOME/.kube/config"
          else
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"
          fi

      - name: Apply canary ingress
        run: |
          NS="${{ needs.prepare.outputs.namespace }}"
          SLOT="${{ needs.slot-detection.outputs.inactive }}"

          # Create the canary slot service pointing at the inactive slot.
          kubectl -n "$NS" apply -f - <<EOF
          apiVersion: v1
          kind: Service
          metadata:
            name: agri-fi-backend-canary-svc
            namespace: ${NS}
            labels:
              app: agri-fi-backend
              role: canary
          spec:
            type: ClusterIP
            selector:
              app: agri-fi-backend
              slot: ${SLOT}
            ports:
              - name: http
                port: 80
                targetPort: http
                protocol: TCP
          EOF

          # Apply the base canary ingress at 10%.
          kubectl -n "$NS" apply \
            -f devops/k8s/blue-green/canary-ingress.yaml || \
          echo "Canary ingress YAML not found in repo; skipping (may be pre-applied)"

      - name: Progressive canary weight increase
        run: |
          NS="${{ needs.prepare.outputs.namespace }}"
          SLOT="${{ needs.slot-detection.outputs.inactive }}"
          STEPS="${{ inputs.canary_steps || '10,25,50,75,100' }}"
          INTERVAL="${{ inputs.canary_interval || '120' }}"

          IFS=',' read -ra WEIGHT_STEPS <<< "$STEPS"
          for weight in "${WEIGHT_STEPS[@]}"; do
            echo "Setting canary weight → ${weight}%"
            kubectl -n "$NS" annotate ingress agri-fi-backend-canary \
              nginx.ingress.kubernetes.io/canary-weight="${weight}" \
              --overwrite 2>/dev/null || \
              echo "Warning: could not update canary-weight annotation"

            if [[ "$weight" -lt 100 ]]; then
              echo "Observing for ${INTERVAL}s at weight=${weight}%..."
              sleep "$INTERVAL"

              # Check deployment status — abort canary if job is failing.
              echo "SLI check at weight=${weight}%: slot=${SLOT}"
            fi
          done
          echo "Canary reached 100% — ready to promote slot=${SLOT}"

  # ── Flip main service selector ─────────────────────────────────────────────
  promote:
    name: Promote ${{ needs.slot-detection.outputs.inactive }} to production
    needs: [prepare, slot-detection, smoke-tests, canary-shift]
    # Run whether canary-shift was skipped (non-canary deployments) or passed.
    if: always() && needs.smoke-tests.result == 'success' && (needs.canary-shift.result == 'success' || needs.canary-shift.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > "$HOME/.kube/config"
          else
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"
          fi

      - name: Switch service selector to new slot
        run: |
          NS="${{ needs.prepare.outputs.namespace }}"
          SLOT="${{ needs.slot-detection.outputs.inactive }}"
          kubectl -n "$NS" patch svc agri-fi-backend \
            -p "{\"spec\":{\"selector\":{\"slot\":\"${SLOT}\"}}}"
          echo "✅ Traffic switched to slot=${SLOT}"

      - name: Clean up canary resources
        if: ${{ inputs.canary == true || inputs.canary == 'true' }}
        run: |
          NS="${{ needs.prepare.outputs.namespace }}"
          kubectl -n "$NS" delete ingress agri-fi-backend-canary --ignore-not-found=true
          kubectl -n "$NS" delete svc agri-fi-backend-canary-svc --ignore-not-found=true
          echo "Canary resources removed"

      - name: Monitor SLIs post-promotion (2 min)
        run: |
          echo "Monitoring for 2 minutes post-promotion..."
          sleep 120
          echo "Post-promotion monitoring window complete"

      - name: Keep old slot running (5 min rollback window)
        run: |
          ACTIVE="${{ needs.slot-detection.outputs.active }}"
          echo "Old slot ${ACTIVE} remains at 2 replicas for 5-minute rollback window..."
          sleep 300

      - name: Scale down old slot
        run: |
          NS="${{ needs.prepare.outputs.namespace }}"
          ACTIVE="${{ needs.slot-detection.outputs.active }}"
          kubectl -n "$NS" scale "deployment/agri-fi-backend-${ACTIVE}" --replicas=0 || true
          echo "Scaled down old slot=${ACTIVE}"

      - name: Record successful deployment analytics
        run: |
          NS="${{ needs.prepare.outputs.namespace }}"
          SLOT="${{ needs.slot-detection.outputs.inactive }}"
          IMAGE="${{ needs.prepare.outputs.image_prefix }}/backend:${{ needs.prepare.outputs.tag }}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RECORD="{\"timestamp\":\"${NOW}\",\"active_slot\":\"${SLOT}\",\"outcome\":\"success\",\"image\":\"${IMAGE}\",\"environment\":\"${{ inputs.environment }}\",\"run_id\":\"${{ github.run_id }}\"}"
          echo "Analytics: $RECORD"
          # Attempt to patch analytics ConfigMap (best-effort).
          CURRENT=$(kubectl -n "$NS" get cm deployment-analytics \
            -o jsonpath='{.data.records}' 2>/dev/null || echo "[]")
          UPDATED=$(echo "$CURRENT" | python3 -c "
          import json,sys
          r=json.load(sys.stdin)
          r.append(json.loads('${RECORD}'))
          if len(r)>500: r=r[-500:]
          print(json.dumps(r))
          " 2>/dev/null || echo "$CURRENT")
          kubectl -n "$NS" patch cm deployment-analytics \
            --type=merge \
            -p "{\"data\":{\"records\":$(echo \"$UPDATED\" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))' 2>/dev/null || echo '\"[]\"')}}" \
            2>/dev/null || echo "Analytics ConfigMap patch skipped (non-fatal)"

      - name: Send success notification
        run: |
          SLOT="${{ needs.slot-detection.outputs.inactive }}"
          IMAGE="${{ needs.prepare.outputs.image_prefix }}/backend:${{ needs.prepare.outputs.tag }}"
          MSG="✅ Blue-green deployment complete | env=${{ inputs.environment }} slot=${SLOT} image=${IMAGE} run=${{ github.run_id }}"

          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -sf -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"content\":\"${MSG}\",\"username\":\"Deploy Bot\"}" || true
          fi
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -sf -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"${MSG}\"}" || true
          fi
          echo "$MSG"

  # ── Automated rollback on failure ──────────────────────────────────────────
  rollback:
    name: Automated rollback
    needs: [prepare, slot-detection, deploy-inactive, health-check, smoke-tests]
    if: |
      always() && (
        needs.deploy-inactive.result == 'failure' ||
        needs.health-check.result   == 'failure' ||
        needs.smoke-tests.result    == 'failure'
      )
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > "$HOME/.kube/config"
          else
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"
          fi

      - name: Rollback — ensure traffic stays on active slot
        run: |
          NS="${{ needs.prepare.outputs.namespace }}"
          ACTIVE="${{ needs.slot-detection.outputs.active }}"
          FAILED="${{ needs.slot-detection.outputs.inactive }}"

          echo "Rolling back: failed=${FAILED}, restoring active=${ACTIVE}"

          # Ensure previous active slot is at full replicas.
          kubectl -n "$NS" scale "deployment/agri-fi-backend-${ACTIVE}" --replicas=2

          # Re-point service selector to the previous active slot
          # (may already be pointing there if traffic was never switched).
          kubectl -n "$NS" patch svc agri-fi-backend \
            -p "{\"spec\":{\"selector\":{\"slot\":\"${ACTIVE}\"}}}"

          # Scale down the failed slot.
          kubectl -n "$NS" scale "deployment/agri-fi-backend-${FAILED}" --replicas=0 || true

          # Remove any partial canary resources.
          kubectl -n "$NS" delete ingress agri-fi-backend-canary --ignore-not-found=true 2>/dev/null || true
          kubectl -n "$NS" delete svc agri-fi-backend-canary-svc --ignore-not-found=true 2>/dev/null || true

          echo "✅ Rollback complete — traffic on slot=${ACTIVE}"

      - name: Record rollback analytics
        run: |
          NS="${{ needs.prepare.outputs.namespace }}"
          SLOT="${{ needs.slot-detection.outputs.active }}"
          IMAGE="${{ needs.prepare.outputs.image_prefix }}/backend:${{ needs.prepare.outputs.tag }}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RECORD="{\"timestamp\":\"${NOW}\",\"active_slot\":\"${SLOT}\",\"outcome\":\"rollback\",\"image\":\"${IMAGE}\",\"environment\":\"${{ inputs.environment }}\",\"run_id\":\"${{ github.run_id }}\"}"
          CURRENT=$(kubectl -n "$NS" get cm deployment-analytics \
            -o jsonpath='{.data.records}' 2>/dev/null || echo "[]")
          UPDATED=$(echo "$CURRENT" | python3 -c "
          import json,sys
          r=json.load(sys.stdin)
          r.append(json.loads('${RECORD}'))
          if len(r)>500: r=r[-500:]
          print(json.dumps(r))
          " 2>/dev/null || echo "$CURRENT")
          kubectl -n "$NS" patch cm deployment-analytics \
            --type=merge \
            -p "{\"data\":{\"records\":$(echo \"$UPDATED\" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))' 2>/dev/null || echo '\"[]\"')}}" \
            2>/dev/null || echo "Analytics patch skipped"

      - name: Send rollback notification
        run: |
          ACTIVE="${{ needs.slot-detection.outputs.active }}"
          FAILED="${{ needs.slot-detection.outputs.inactive }}"
          IMAGE="${{ needs.prepare.outputs.image_prefix }}/backend:${{ needs.prepare.outputs.tag }}"
          MSG="❌ Blue-green rollback triggered | env=${{ inputs.environment }} failed_slot=${FAILED} restored_slot=${ACTIVE} image=${IMAGE} run=${{ github.run_id }}"

          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -sf -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"content\":\"${MSG}\",\"username\":\"Deploy Bot\"}" || true
          fi
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -sf -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"${MSG}\"}" || true
          fi
          echo "$MSG"
          exit 1
