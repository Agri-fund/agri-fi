services:
  # ── Redis cache with eviction policy (#735) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory
      - "128mb"
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Prometheus Redis Exporter (#735) ────────────────────────────────────────
  # Exposes Redis INFO metrics on :9121 so Prometheus alert rules can
  # evaluate redis_memory_used_bytes / redis_memory_max_bytes.
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - '9121:9121'
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agric_onchain
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'  # management UI
      - '15692:15692'  # Prometheus metrics
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ./devops/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./devops/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/agric_onchain
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      # SEP-10 Stellar Web Auth domain configuration (see docs/auth/sep10-flow.md)
      - SEP10_DOMAIN=agri-fi.com
      # Distributed tracing (#1233) — export OTLP spans to the collector.
      - OTEL_SERVICE_NAME=agri-fi-backend
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://otel-collector:4318/v1/traces
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=1.0
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=local
      - OTEL_SDK_DISABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      clamav:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  soroban:
    image: stellar/soroban-preview:latest
    container_name: soroban-cli
    working_dir: /app
    volumes:
      - ./blockchain:/app/blockchain
      - ./target:/app/target
    environment:
      - SOROBAN_RPC_HOST=http://soroban-rpc:8000/rpc
      - SOROBAN_RPC_URL=http://soroban-rpc:8000/rpc
      - NETWORK=standalone
    command: /bin/bash
    stdin_open: true
    tty: true
    depends_on:
      - soroban-rpc
    networks:
      - default

  soroban-rpc:
    image: stellar/quickstart:testing
    container_name: soroban-rpc
    ports:
      - '8000:8000'
    environment:
      - SOROBAN_RPC_FRIENDBOT_URL=http://localhost:8000/friendbot
    command: --local --enable rpc,horizon
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' http://localhost:8000/rpc | grep -q healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - default

  clamav:
    image: clamav/clamav:stable
    ports:
      - '3310:3310'
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - '9090:9090'
    volumes:
      - ./devops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./devops/prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--storage.tsdb.min-block-duration=2h'
      - '--storage.tsdb.max-block-duration=2h'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--alertmanager.url=http://alertmanager:9093'
    depends_on:
      - rabbitmq
      - alertmanager
    restart: unless-stopped


  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - '9093:9093'
    volumes:
      - ./devops/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - '3002:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./devops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./devops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── OpenTelemetry Collector + Jaeger (#1233) ────────────────────────────────
  # Receives OTLP traces from the backend, forwards them to Jaeger and derives
  # RED metrics on :8889 for Prometheus alerting.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      - ./devops/otel/collector-config.yaml:/etc/otel/collector-config.yaml:ro
    ports:
      - '4317:4317'   # OTLP gRPC
      - '4318:4318'   # OTLP HTTP
      - '8889:8889'   # Prometheus span metrics
      - '13133:13133' # health check
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
      # In-memory storage with a bounded trace count. Production should use a
      # durable backend (Elasticsearch/Cassandra) — see the tracing docs.
      SPAN_STORAGE_TYPE: memory
      MEMORY_MAX_TRACES: '50000'
    ports:
      - '16686:16686' # Jaeger UI
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
